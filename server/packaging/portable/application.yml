# Portable packaging defaults, outside Spring Boot's auto-scanned ./config/*/ directories.
# Actual credentials belong in environment or external config.
server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: family-learning
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/family_learning_uuid?useUnicode=true&characterEncoding=UTF-8&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=UTC}
    driver-class-name: com.mysql.jdbc.Driver
    username: ${DB_USER:family}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-init-sql: SET time_zone = '+00:00'
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
mybatis:
  type-handlers-package: cn.family.learning.data.types
  configuration:
    map-underscore-to-camel-case: true
app:
  db-migrations-enabled: ${DB_MIGRATIONS_ENABLED:true}
  role: ${APP_ROLE:api}
  storage-path: ${STORAGE_PATH:./data/uploads}
  invite-code: ${INVITE_CODE:}
  ai-key: ${DASHSCOPE_API_KEY:}
  ai-base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com}
  vision-model: ${VISION_MODEL:qwen3-vl-plus}
  speech-model: ${SPEECH_MODEL:qwen3-tts-flash}
  worker-poll-ms: ${WORKER_POLL_MS:2000}
  daily-job-limit: ${AI_DAILY_JOB_LIMIT:1000}
logging:
  level:
    root: INFO
    cn.family.learning: INFO
